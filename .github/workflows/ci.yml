name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /dev/null ./cmd/hermes

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend tests
        run: node --test web/tests/

      - name: JS syntax
        run: for f in web/static/*.js; do node --check "$f" || exit 1; done

      - name: Shell syntax
        run: sh -n scripts/fetch-assets.sh
