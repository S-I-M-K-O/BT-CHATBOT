services:
  bt-chatbot:
    build: .
    container_name: bt-chatbot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ADDR=0.0.0.0
      - OLLAMA_BASE=http://host.docker.internal:11434
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-medium-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s